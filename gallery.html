<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/png" href="fabicon.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        .gallery-pair {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.9rem;
        }

        .gallery-pair img {
            width: 100%;
            height: 100%;
            max-height: 320px;
            object-fit: cover;
            border-radius: 14px;
        }

        @media (max-width: 640px) {
            .gallery-pair {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <title>VM The GYM</title>
</head>

<body>
    <header class="site-header">
        <div class="container nav">
            <a href="index.html" class="brand">
                <img src="vmlogo.jpg" alt="VM The Gym logo" class="brand-mark">
                <span class="brand-lockup">
                    <span class="brand-text">VM THE GYM</span>
                    <span class="brand-tagline">Elevate Your Fitness</span>
                </span>
            </a>
            <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav class="site-nav">
                <a href="index.html">Back to Home</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="section">
            <div class="container">
                <div class="section-heading reveal">
                    <p class="eyebrow">VM Gallery</p>
                    <h2>Training Moments</h2>
                </div>
                <div class="card-grid">
                    <article class="service-card reveal">
                        <div class="gallery-pair">
                            <img src="image2.jpg" alt="Gym gallery image 2">
                            <img src="image3.jpg" alt="Gym gallery image 3">
                        </div>
                    </article>
                    <article class="service-card reveal">
                        <img src="image4.jpg" alt="Gym gallery image 4">
                    </article>
                </div>
            </div>
        </section>
    </main>

    <script src="neelu.js"></script>
</body>

</html>
